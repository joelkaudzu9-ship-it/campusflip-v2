plugins {
    id 'com.android.application'
}

android {
    namespace 'com.campusflip.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.campusflip.app'
        minSdk 21
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName = System.getenv('APP_VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'campusflip'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
