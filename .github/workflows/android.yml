name: Build Android app

# Run by hand: GitHub → Actions → "Build Android app" → Run workflow.
# It builds the signed APK, saves it as a download, and puts it on the site at /downloads/campusflip.apk.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_B64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/campusflip.jks"

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/campusflip.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk out/campusflip.apk
          cp out/campusflip.apk public/downloads/campusflip.apk
          sha256sum out/campusflip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: campusflip-apk
          path: out/campusflip.apk

      - name: Publish on the website
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/downloads/campusflip.apk
          git commit -m "Android app 1.0.${{ github.run_number }}" || echo "No change"
          git push
