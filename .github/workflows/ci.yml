name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Mock build for browser tests
        run: npm run build:mock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (routes, layout, mobile + desktop)
        run: npm run test:smoke
      - name: Contrast audit (WCAG AA)
        run: npm run test:contrast

  database:
    name: Database security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migration + attack/legit-flow tests on a throwaway Postgres
        run: bash supabase/tests/ci/run.sh
